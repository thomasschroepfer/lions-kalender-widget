name: Kalender veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Zeiten in UTC. Läuft im Dezember alle 30 Min., damit ein neues Türchen
    # auch dann zeitnah erscheint, wenn GitHub einen Lauf verspätet oder auslässt.
    - cron: '3,33 * 30 11 *'   # 30.11. ganztägig: beendet auch eine evtl. Testansicht
    - cron: '3,33 * 1-25 12 *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs
        env:
          DOOR_KEY: ${{ secrets.DOOR_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
